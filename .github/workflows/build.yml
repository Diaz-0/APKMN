name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    # Cache del directorio .buildozer (SDK + NDK + python-for-android)
    # Esto evita re-descargar ~2GB en cada run
    steps:
      # ---------------------------------------------------------
      # 1. Liberar espacio en disco y RAM (evita OOM / timeout)
      # ---------------------------------------------------------
      - name: Free disk space & RAM
        run: |
          echo "=== Espacio antes ==="
          df -h /
          echo "=== Memoria antes ==="
          free -h

          # Borrar paquetes pesados preinstalados en GitHub runners
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/lib/android/sdk/ndk-bundle 2>/dev/null || true
          sudo rm -rf /usr/local/lib/android/sdk/ndk/* 2>/dev/null || true
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

          echo "=== Espacio después ==="
          df -h /
          echo "=== Memoria después ==="
          free -h

      # ---------------------------------------------------------
      # 2. Checkout del repositorio
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 3. Configurar Python 3.11 EXPLÍCITAMENTE (evita Python 3.14 del runner)
      # ---------------------------------------------------------
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ---------------------------------------------------------
      # 4. Cache de buildozer (SDK, NDK, python-for-android) - CLAVE v3 (evita cache 3.14)
      # ---------------------------------------------------------
      - name: Cache buildozer directory
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ${{ github.workspace }}/.buildozer
          key: buildozer-${{ runner.os }}-python311-v3-${{ hashFiles('buildozer.spec') }}-${{ hashFiles('main.py') }}
          restore-keys: |
            buildozer-${{ runner.os }}-python311-v3-

      # ---------------------------------------------------------
      # 5. Instalar dependencias del sistema (mínimas, SIN python3 - ya viene de setup-python)
      # ---------------------------------------------------------
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            git zip unzip \
            libssl-dev libffi-dev build-essential \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libltdl-dev

      # ---------------------------------------------------------
      # 5. Configurar Java 17
      # ---------------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # ---------------------------------------------------------
      # 6. Instalar buildozer con pip compatible
      # ---------------------------------------------------------
      - name: Install buildozer
        run: |
          # Usar pip 23.3.2 (compatible con python-for-android, evita BuildDependencyInstallError)
          python3 -m pip install --upgrade "pip==23.3.2" "setuptools==65.5.0" wheel
          python3 -m pip install --no-cache-dir buildozer

      # ---------------------------------------------------------
      # 7. Instalar Android SDK Command-line Tools (necesario para sdkmanager moderno)
      # ---------------------------------------------------------
      - name: Install Android SDK cmdline-tools
        run: |
          export ANDROID_SDK_ROOT=$HOME/.buildozer/android/platform/android-sdk
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          cd "$ANDROID_SDK_ROOT/cmdline-tools"
          # Descargar command-line tools si no existe
          if [ ! -d "latest" ]; then
            wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
            unzip -q cmdline-tools.zip
            mv cmdline-tools latest
            rm cmdline-tools.zip
          fi
          export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH
          # Instalar platform-tools y platforms necesarios
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      # ---------------------------------------------------------
      # 7b. Crear symlink para compatibilidad con python-for-android
      # p4a busca sdkmanager en tools/bin/sdkmanager (ruta antigua)
      # ---------------------------------------------------------
      - name: Create sdkmanager symlink for p4a compatibility
        run: |
          export ANDROID_SDK_ROOT=$HOME/.buildozer/android/platform/android-sdk
          mkdir -p "$ANDROID_SDK_ROOT/tools/bin"
          ln -sf "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "$ANDROID_SDK_ROOT/tools/bin/sdkmanager"
          ln -sf "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/avdmanager" "$ANDROID_SDK_ROOT/tools/bin/avdmanager" 2>/dev/null || true
          echo "Symlink created: $ANDROID_SDK_ROOT/tools/bin/sdkmanager -> $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          ls -la "$ANDROID_SDK_ROOT/tools/bin/"

      # ---------------------------------------------------------
      # 8. Pre-aceptar licencias del SDK de Android (evita prompt interactivo)
      # ---------------------------------------------------------
      - name: Accept Android SDK licenses
        run: |
          export ANDROID_SDK_ROOT=$HOME/.buildozer/android/platform/android-sdk
          export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH
          # Crear directorio de licencias y aceptar todas
          mkdir -p "$ANDROID_SDK_ROOT/licenses"
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_SDK_ROOT/licenses/android-sdk-license"
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_SDK_ROOT/licenses/android-sdk-license"
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" >> "$ANDROID_SDK_ROOT/licenses/android-sdk-license"
          echo "84831b9409646a918e30573bab4c9c91346d8abd" >> "$ANDROID_SDK_ROOT/licenses/android-sdk-license"
          # También para NDK si existe
          if [ -d "$HOME/.buildozer/android/platform/android-ndk-r28c" ]; then
            mkdir -p "$HOME/.buildozer/android/platform/android-ndk-r28c/licenses"
            echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$HOME/.buildozer/android/platform/android-ndk-r28c/licenses/android-sdk-license" 2>/dev/null || true
          fi

      # ---------------------------------------------------------
      # 10b. Forzar pip compatible en entorno buildozer
      # ---------------------------------------------------------
      - name: Force compatible pip in buildozer env
        run: |
          # buildozer crea su propio venv, forzar pip 23.3.2 allí también
          if [ -d "$HOME/.buildozer/android/platform/build-arm64-v8a_armeabi-v7a/build/other_builds/hostpython3/desktop/hostpython3/native-build" ]; then
            echo "Buildozer env found, will use pip from there"
          fi
          # Exportar variables para que buildozer use pip correcto
          export PIP_VERSION=23.3.2
          export SETUPTOOLS_VERSION=65.5.0

      # ---------------------------------------------------------
      # 11. Build APK con buildozer (con reintentos para descargas)
      # ---------------------------------------------------------
      - name: Build APK
        run: |
          export ANDROID_SDK_ROOT=$HOME/.buildozer/android/platform/android-sdk
          export ANDROID_NDK_ROOT=$HOME/.buildozer/android/platform/android-ndk-r28c
          export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/tools:$PATH

          # Función de reintento para descargas inestables
          retry() {
            local n=1
            local max=3
            local delay=15
            while true; do
              "$@" && break || {
                if [[ $n -lt $max ]]; then
                  ((n++))
                  echo "Command failed. Attempt $n/$max. Retrying in $delay seconds..."
                  sleep $delay
                else
                  echo "Command failed after $max attempts."
                  return 1
                fi
              }
            done
          }

          # Ejecutar buildozer con reintentos
          retry buildozer -v android release

      # ---------------------------------------------------------
      # 9. Subir artefacto (APK)
      # ---------------------------------------------------------
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: monitor-red-apk
          path: bin/*.apk
          retention-days: 30

      # ---------------------------------------------------------
      # 10. Subir AAB si se genera
      # ---------------------------------------------------------
      - name: Upload AAB artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitor-red-aab
          path: bin/*.aab
          retention-days: 30